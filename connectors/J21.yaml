# uaBrain castellated edge connector J21 (top edge)
# DC motor 2 (ETB/stepper), auxiliary analog input 2, MAP
meta: config/boards/hellen_mm100_meta.h

pins:
  - pin: J21-1
    class: outputs
    ts_name: DC2-
    function: DC2- output
    type: etb

  - pin: J21-2
    class: outputs
    ts_name: DC2+
    function: DC2+ output
    type: etb

  - pin: J21-3
    id: [MM100_IN_AUX3, MM100_IN_AUX3_ANALOG]
    class: [switch_inputs, analog_inputs]
    ts_name: ___ AIN2 / Digital input
    function: Auxiliary analog input 2 PullDown 500K / digital input
    type: av

  - pin: J21-4
    function: +5v sensor supply (protected)
    type: 5v

  - pin: J21-5
    function: GNDA Analog/Sensor Ground
    type: agnd

  - pin: J21-6
    meta: MM100_IN_MAP1_ANALOG
    class: analog_inputs
    ts_name: ___ MAP
    function: MAP Sensor Input
    type: av

  - pin: J21-7
    function: +5v sensor supply (protected)
    type: 5v

  - pin: J21-8
    function: GNDA Analog/Sensor Ground
    type: agnd
